http:
  port: "8081"
# The spec the router loads. It is kept in src/main/resources/api/ until it is published to Exchange;
# then this becomes resource::<groupId>:<assetId>:<version>:oas:zip:orders-api.yaml.
api:
  spec: "orders-api.yaml"
orders:
  backend:
    host: "localhost"
    port: "9091"
    timeoutMillis: "5000"
    # Bounds the TCP connect, which responseTimeout does not (the connector's default is 30 s). A worst case counts both.
    connectionTimeoutMillis: "1000"
