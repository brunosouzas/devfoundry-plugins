openapi: 3.0.3
info:
  title: Orders API
  version: "1.0"
servers:
  - url: /api
paths:
  /orders:
    get:
      summary: List orders by status
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [OPEN, CLOSED]
      responses:
        "200":
          description: The orders with that status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "400":
          description: Missing or invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{orderId}:
    get:
      summary: Get one order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            pattern: "^ORD-[0-9]{6}$"
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: No order with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Order:
      type: object
      required: [orderId, status]
      properties:
        orderId:
          type: string
        status:
          type: string
          enum: [OPEN, CLOSED]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
