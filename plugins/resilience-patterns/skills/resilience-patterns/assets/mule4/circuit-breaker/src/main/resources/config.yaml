# Synthetic values only.
http:
  port: "8081"
carrier:
  host: "rates.carrier.example.test"
  port: "443"
  basePath: "/v3"
  # Well below the default (60 s): a slow call must not hold a thread for long. Set from the dependency's normal latency.
  responseTimeoutMillis: "2000"
breaker:
  # Consecutive dependency failures (timeout, connectivity, 5xx) that open the circuit.
  failureThreshold: "3"
  # How long the circuit stays open before one trial call is let through (half-open).
  openSeconds: "30"
